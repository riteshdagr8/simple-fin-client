name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      # Reports dependency vulnerabilities without failing the build.
      # Pre-existing high-severity transitive issues (ip-address via express,
      # sharp <0.35 libvips CVEs) would otherwise block CI; fixing them needs
      # a deliberate dependency-upgrade task (sharp's fix is a breaking major).
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --json || true
